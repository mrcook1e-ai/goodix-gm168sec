# fprintd drop-in installed by libfprint-goodix-gm168.
# Routes fprintd to the isolated private libfprint build under
# /opt/libfprint-gm168 instead of the system library.
# Keep strictly scoped: no GM168_LOG_DIR, no frame dumps.
[Service]
Environment=LD_LIBRARY_PATH=/opt/libfprint-gm168/lib64
Environment=OPENSSL_CONF=/etc/pki/tls/openssl3.cnf
ReadWritePaths=-/etc/goodix-gm168
